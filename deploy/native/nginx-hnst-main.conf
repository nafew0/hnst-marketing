# The live site, hnst.marketing (since 7 Nov 2026). Install at
# /etc/nginx/conf.d/hnst-main.conf; the certificate comes from
#   certbot certonly --nginx -d hnst.marketing -d www.hnst.marketing
# www and plain HTTP redirect to https://hnst.marketing. dev.hnst.marketing
# (nginx-hnst.conf) keeps serving the same app.
# X-Forwarded-For appends here, and the app trusts the first value (open, P8).
server {
    listen 443 ssl http2;
    server_name hnst.marketing;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/hnst.marketing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hnst.marketing/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Large response headers (CSP) overflow nginx's default buffers and return 502.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl http2;
    server_name www.hnst.marketing;

    ssl_certificate /etc/letsencrypt/live/hnst.marketing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hnst.marketing/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hnst.marketing$request_uri;
}

server {
    listen 80;
    server_name hnst.marketing www.hnst.marketing;

    # certbot renews over HTTP through its nginx plugin.
    location / {
        return 301 https://hnst.marketing$request_uri;
    }
}
