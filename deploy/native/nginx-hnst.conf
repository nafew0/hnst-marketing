# Install at /etc/nginx/conf.d/hnst.conf with __DOMAIN__ replaced. certbot adds
# the TLS lines. X-Forwarded-For appends here, and the app trusts the first value:
# P8 must close that before the SITE_PASSWORD gate comes off.
server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 25m;

    # Large response headers (CSP) overflow nginx's default buffers and return 502.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
