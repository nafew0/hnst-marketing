name: CI
permissions:
  contents: read
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hnst
          POSTGRES_PASSWORD: hnst
          POSTGRES_DB: hnst
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hnst"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hnst:hnst@127.0.0.1:5432/hnst
      NEXT_PUBLIC_BASE_URL: http://localhost:3003
      P3_BASE_URL: http://localhost:3003
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Prepare isolated CI environment
        run: |
          rm -f .env .env.development .env.production
          echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ALTCHA_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Seed disposable CMS
        run: |
          bun run seed
          bun e2e/p3-setup.ts
      - name: Quality gate
        run: bun run check
      - name: Production build (mocks disabled)
        run: bun run build
      - name: Install browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Production Lighthouse budgets
        run: |
          bunx next start --port 3003 > /tmp/hnst-production.log 2>&1 &
          PROD_PID=$!
          trap 'kill "$PROD_PID"' EXIT
          for attempt in $(seq 1 60); do curl -sf http://localhost:3003/packages > /dev/null && break; sleep 2; done
          bunx lhci autorun --config=e2e/p3-lighthouse.cjs
      - name: Browser checks against mock API
        run: |
          NEXT_PUBLIC_API_MOCKS=1 bunx next dev --port 3003 > /tmp/hnst-browser.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID"' EXIT
          for attempt in $(seq 1 60); do curl -sf http://localhost:3003/packages > /dev/null && break; sleep 2; done
          bunx playwright test --config e2e/p3.config.ts --project chromium --project webkit
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p3-diagnostics
          path: |
            test-results/
            .lighthouseci/
          retention-days: 7
